stages:
  - test
  - build
  - deploy

# 1. Analyse SAST (optionnel, utile pour la sécurité)
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml

# 2. Étape de build Docker
build:
  stage: build
  image: docker:20
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - docker build -t nest-back4app-app .

# 3. Déploiement via SSH sur un VPS
deploy:
  stage: deploy
  image: node:18
  only:
    - main
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "$FLY_API_TOKEN" | flyctl auth token
    - npm install
    - npm run build || (echo "Erreur build : $?"; cat dist/main.js || true; exit 1)
    - flyctl deploy --app $FLY_APP_NAME --remote-only
